name: Docker Build & Publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Verify production dependency tree
        run: npm ls --omit=dev --depth=0

  build-and-publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate release-ness before any Docker work
        id: release-gate
        run: |
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "::error::Tag '${{ github.ref_name }}' is not a Release: expected a strict semver tag vX.Y.Z (e.g. v0.1.0)"
            exit 1
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags for runner
        id: meta-runner
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/runner
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || steps.release-gate.outputs.is_release == 'true' }}
            type=sha,format=long

      - name: Generate tags for migrator
        id: meta-migrator
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-migrator
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || steps.release-gate.outputs.is_release == 'true' }}
            type=sha,format=long

      - name: Build runner for smoke test (amd64, loaded)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}/runner:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrator for smoke test (amd64, loaded)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}-migrator:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test images before any push
        run: scripts/smoke-test.sh --image "ghcr.io/${{ github.repository }}/runner:smoke" --migrator-image "ghcr.io/${{ github.repository }}-migrator:smoke"

      - name: Build and push runner (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-runner.outputs.tags }}
          labels: ${{ steps.meta-runner.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrator (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-migrator.outputs.tags }}
          labels: ${{ steps.meta-migrator.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release (draft)
        if: steps.release-gate.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
