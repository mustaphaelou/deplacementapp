name: Docker Build & Publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy-dry-run:
        description: "Validate the deploy job without firing the Coolify webhook (dry run)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Verify production dependency tree
        run: npm ls --omit=dev --depth=0

  publish-check:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.release-gate.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate release-ness before any Docker work
        id: release-gate
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a Release: expected a strict semver tag vX.Y.Z (e.g. v0.1.0)"
            exit 1
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runner for smoke test (amd64, loaded)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}/runner:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrator for smoke test (amd64, loaded)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}-migrator:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test images before any push
        run: scripts/smoke-test.sh --image "ghcr.io/${{ github.repository }}/runner:smoke" --migrator-image "ghcr.io/${{ github.repository }}-migrator:smoke"

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: publish-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Image map: one row per image (Dockerfile stage → GHCR image → platforms).
          - id: runner
            target: runner
            image: ghcr.io/${{ github.repository }}/runner
            platforms: linux/amd64,linux/arm64
          - id: migrator
            target: migrator
            image: ghcr.io/${{ github.repository }}-migrator
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags for ${{ matrix.id }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || needs.publish-check.outputs.is_release == 'true' }}
            type=sha,format=long

      - name: Build and push ${{ matrix.id }} (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: needs.publish-check.outputs.is_release == 'true'
    needs: [publish-check, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true

  deploy:
    if: needs.publish-check.outputs.is_release == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy-dry-run == 'true')
    needs: [publish-check, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production (Coolify deploy webhook)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOY_DRY_RUN: ${{ inputs.deploy-dry-run }}
        run: |
          if [[ "$DEPLOY_DRY_RUN" == "true" ]]; then
            scripts/deploy-coolify.sh --dry-run --ref "$GITHUB_REF_NAME"
          else
            scripts/deploy-coolify.sh --ref "$GITHUB_REF_NAME"
          fi
