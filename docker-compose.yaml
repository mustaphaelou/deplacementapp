services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Mmmm2005.}
      POSTGRES_DB: ${POSTGRES_DB:-deplacementapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-deplacementapp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrator
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-Mmmm2005.}@db:5432/${POSTGRES_DB:-deplacementapp}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-Mmmm2005.}@db:5432/${POSTGRES_DB:-deplacementapp}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-dev-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@exemple.ma}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
    volumes:
      - uploads:/app/public/uploads
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
